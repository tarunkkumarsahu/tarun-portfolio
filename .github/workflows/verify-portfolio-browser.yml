name: Portfolio Browser Verification

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/media/**"
      - "public/models/**"
      - "public/resume/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/verify-portfolio-browser.mjs"
      - ".github/workflows/verify-portfolio-browser.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/media/**"
      - "public/models/**"
      - "public/resume/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/verify-portfolio-browser.mjs"
      - ".github/workflows/verify-portfolio-browser.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/portfolio-next.log 2>&1 &
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/portfolio-next.log
          exit 1
      - name: Verify interactions and responsive layouts in Chromium
        run: node .github/verify-portfolio-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-check
          path: |
            portfolio-browser-check.png
            portfolio-browser-1366.png
            portfolio-browser-tablet.png
            portfolio-browser-mobile.png
            /tmp/portfolio-next.log
          if-no-files-found: ignore
